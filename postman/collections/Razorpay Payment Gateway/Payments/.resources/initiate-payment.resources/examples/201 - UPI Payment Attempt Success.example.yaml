$kind: http-example
request:
  url: "{{baseUrl}}/v1/payments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: X-Idempotency-Key
      value: "{{$guid}}"
      description: Optional idempotency key to prevent duplicate payment initiation
  body:
    type: json
    content: |-
      {
        "orderId": "2540aac5-7ae4-417a-b2c7-cc28432dc00f",
        "paymentMethod": "UPI",
        "methodDetails": {
          "vpa": "success@okaxis"
        }
      }
