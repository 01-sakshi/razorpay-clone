$kind: http-example
name: 201 - UPI Payment Attempt Failed
request:
  url: "{{baseUrl}}/v1/payments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: X-Idempotency-Key
      value: "{{$guid}}"
      description: Optional idempotency key to prevent duplicate payment initiation
  body:
    type: json
    content: |-
      {
        "orderId": "2fc62f38-12e5-471c-aaba-f084d9d106f4",
        "paymentMethod": "UPI",
        "methodDetails": {
          "vpa": "fail@okaxis"
        }
      }
