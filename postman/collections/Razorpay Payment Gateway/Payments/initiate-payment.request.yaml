$kind: http-request
name: Initiate Payment
method: POST
url: "{{baseUrl}}/v1/payments"
examples: .resources/initiate-payment.resources/examples
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: "{{$guid}}"
    description: Optional idempotency key to prevent duplicate payment initiation
body:
  type: json
  content: |-
    {
      "orderId": "8275fb57-3b74-4819-886d-3bb93332748d",
      "paymentMethod": "NETBANKING",
      "methodDetails": {
        "bankCode": "HDFC"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has payment id and status", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("method");
          pm.collectionVariables.set("paymentId", json.id);
      });
    language: text/javascript
