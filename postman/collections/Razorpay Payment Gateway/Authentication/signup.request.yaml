$kind: http-request
name: Sign Up
method: POST
url: "{{baseUrl}}/v1/auth/signup"
examples: .resources/signup.resources/examples
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sakshi Aggarwal",
      "email": "sakshi@example.com",
      "password": "password",
      "businessName": "Sakshi Stores",
      "businessType": "PROPRIETORSHIP"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has merchant id", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("email");
          pm.expect(json).to.have.property("merchantStatus");
      });
    language: text/javascript
