$kind: http-request
name: Revoke API Key
method: DELETE
url: '{{baseUrl}}/v1/merchants/api-keys/revoke/:keyId'
order: 3000
pathVariables:
  - key: keyId
    value: '{{apiKeyId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
