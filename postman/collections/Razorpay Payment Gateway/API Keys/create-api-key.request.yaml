$kind: http-request
name: Create API Key
method: POST
url: '{{baseUrl}}/v1/merchants/api-keys'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "environment": "DEV"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response contains keyId and keySecret", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("keyId");
          pm.expect(json).to.have.property("keySecret");
          pm.collectionVariables.set("apiKeyId", json.keyId);
          pm.collectionVariables.set("apiKeySecret", json.keySecret);
      });
