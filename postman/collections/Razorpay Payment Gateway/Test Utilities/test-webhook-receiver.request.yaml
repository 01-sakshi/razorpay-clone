$kind: http-request
name: Test Webhook Receiver
method: POST
url: '{{baseUrl}}/v1/merchant/webhooks'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "event": "PAYMENT_STATUS_CHANGED",
      "paymentId": "{{paymentId}}",
      "status": "CAPTURED"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
