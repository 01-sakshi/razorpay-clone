$kind: http-request
name: Get Webhook Config
method: GET
url: "{{baseUrl}}/v1/merchants/webhooks/3948f086-ee1a-4306-ade1-9b92f29e2a4e"
examples: .resources/get-webhook-config.resources/examples
order: 3000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has expected fields", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("targetUrl");
          pm.expect(json).to.have.property("enabled");
      });
    language: text/javascript
