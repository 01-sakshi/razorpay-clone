$kind: http-request
name: Cancel Order
method: POST
url: '{{baseUrl}}/v1/orders/cancel/:orderId'
order: 3000
pathVariables:
  - key: orderId
    value: '{{orderId}}'
    description: UUID of the order to cancel
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
