$kind: collection
name: Orders
description: |-
  Create and manage payment orders.
  Requires HTTP Basic authentication using API Key credentials (keyId:keySecret, Base64-encoded).
  The Authorization header format is: Basic base64(keyId:keySecret)
order: 4000
auth:
  type: basic
  credentials:
    - key: username
      value: '{{apiKeyId}}'
    - key: password
      value: '{{apiKeySecret}}'
