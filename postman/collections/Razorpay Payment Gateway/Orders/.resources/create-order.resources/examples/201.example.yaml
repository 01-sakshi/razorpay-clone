$kind: http-example
request:
  url: "{{baseUrl}}/v1/orders"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: X-Idempotency-Key
      value: "{{$guid}}"
      description: Optional idempotency key to prevent duplicate order creation
  body:
    type: json
    content: |-
      {
        "amount": {
          "amountUnits": 50000,
          "currency": "INR"
        },
        "receipt": "order_receipt_00",
        "notes": {
          "purpose": "Product purchase"
        },
        "customer": {
          "name": "John Doe",
          "phone": "9876543210",
          "email": "john@example.com"
        }
      }
