$kind: http-request
name: Create Order
method: POST
url: "{{baseUrl}}/v1/orders"
examples: .resources/create-order.resources/examples
order: 1000
headers:
  - key: Content-Type
    value: application/json
    disabled: false
  - key: X-Idempotency-Key
    value: feade18f-a510-429a-89fe-6b30272e9aep
    disabled: true
    description: Optional idempotency key to prevent duplicate order creation
body:
  type: json
  content: |-
    {
      "amount": {
        "amountUnits": 50000,
        "currency": "INR"
      },
      "receipt": "order_receipt_027",
      "notes": {
        "purpose": "Product purchase"
      },
      "customer": {
        "name": "John Doe",
        "phone": "9876543210",
        "email": "john@example.com"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has orderId and status", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("orderId");
          pm.expect(json).to.have.property("status");
          pm.collectionVariables.set("orderId", json.orderId);
          pm.collectionVariables.set("webhookConfigId", json.id)
      });
    language: text/javascript
