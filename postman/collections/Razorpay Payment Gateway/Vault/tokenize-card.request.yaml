$kind: http-request
name: Tokenize Card
method: POST
url: '{{baseUrl}}/v1/vault/tokenize'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Key
    value: '{{$guid}}'
    description: Optional idempotency key to prevent duplicate tokenization
body:
  type: json
  content: |-
    {
      "customerId": "{{customerId}}",
      "pan": "4111111111111111",
      "expiryMonth": 12,
      "expiryYear": 2027,
      "cvv": "123",
      "cardHolderName": "John Doe"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has token and card details", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.expect(json).to.have.property("lastFour");
          pm.expect(json).to.have.property("cardBrand");
          pm.collectionVariables.set("cardToken", json.token);
      });
